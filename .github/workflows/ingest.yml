name: presby-site-kit / ingest

# Reusable workflow — a site-<slug> content repo calls this on push to main,
# never runs it directly. Builds the JSON bundle presby's own
# POST /api/sites/ingest expects (scripts/build-bundle.mjs, this repo) and
# POSTs it, authenticated as this exact job via GitHub Actions OIDC — no
# stored credential in the content repo. See presby's own
# docs/work-log/2026-08-20-public-sites.md (DECISION-087) for the token
# contract this satisfies: iss/aud/repository_owner/ref/job_workflow_ref are
# all checked server-side against this job's own identity.
#
# `job_workflow_ref` prefix-matches "<owner>/presby-site-kit/.github/workflows/"
# on the verifying end — satisfied by this file's own path, not by anything a
# calling repo controls.

on:
  workflow_call:
    inputs:
      presby_ingest_url:
        description: "Full URL of presby's POST /api/sites/ingest endpoint."
        required: true
        type: string
      oidc_audience:
        description: "Must match presby's own SITES_INGEST_OIDC_AUDIENCE env var exactly."
        required: true
        type: string
      site_kit_ref:
        description: "presby-site-kit ref to pull build-bundle.mjs from. Defaults to this workflow's own ref."
        required: false
        type: string
        default: "main"

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout content repo
        uses: actions/checkout@v4

      - name: Checkout presby-site-kit (for build-bundle.mjs)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/presby-site-kit
          ref: ${{ inputs.site_kit_ref }}
          path: .site-kit

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build content bundle
        run: node .site-kit/scripts/build-bundle.mjs "$GITHUB_WORKSPACE" bundle.json

      - name: Request OIDC token and ingest
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");

            const audience = ${{ toJSON(inputs.oidc_audience) }};
            const url = ${{ toJSON(inputs.presby_ingest_url) }};

            const token = await core.getIDToken(audience);
            const bundle = fs.readFileSync("bundle.json", "utf-8");

            const res = await fetch(url, {
              method: "POST",
              headers: {
                "content-type": "application/json",
                authorization: `Bearer ${token}`,
              },
              body: bundle,
            });

            const bodyText = await res.text();
            core.info(`presby ingest responded ${res.status}: ${bodyText}`);

            if (!res.ok) {
              core.setFailed(`Ingest failed with status ${res.status}: ${bodyText}`);
            }
